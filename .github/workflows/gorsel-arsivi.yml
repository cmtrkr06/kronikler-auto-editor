# Blogger'daki "Görsel arşivi" taslağını okur, resim kütüphanesini (data/images.json) günceller ve yeni
# resimleri bir kez etiketler (hızlı görsel model, resim başına 1 istek). Arşive resim ekleyince çalıştır;
# günlük akış da her çalıştırmada yeniler. Telefondan: Actions -> "Gorsel arsivi" -> Run workflow.
name: Gorsel arsivi

on:
  workflow_dispatch:

concurrency:
  group: state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  arsiv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Europe/Istanbul
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BLOGGER_ID: ${{ secrets.BLOGGER_ID }}
      BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
    steps:
      - uses: actions/checkout@v4

      - name: Durumu çek (state dalı -> data/)
        run: |
          if git ls-remote --exit-code --heads origin state >/dev/null; then
            git clone -q --depth 1 --branch state "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
          else
            mkdir -p data && git -C data init -q -b state
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Blogger girişi
        run: bash blogger_login.sh

      - name: Arşivi oku ve etiketle
        run: python image_library.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Durumu geri yaz
        if: always()
        working-directory: data
        run: |
          rm -f ../token.json
          git config user.name "kronikler-bot"
          git config user.email "kronikler-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "görsel arşivi $(date '+%F %H:%M')"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:state
