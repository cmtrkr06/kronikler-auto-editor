# Haftada 3 akşam (Pzt/Çrş/Cum 21:15 TR, Zapyus'un gün içi çalışmalarından sonra; ortak Gemini kotası):
# CarScore'u okur, en iyi konuyu yazar, kontrol eder, HAZIR ise fotoğraf + veri görselleriyle Blogger'a
# TASLAK gönderir. Yayın her zaman elle. Haftada en çok 3, günde en çok 1 taslak; yazmaya değer veri yoksa
# 0 taslak normaldir. Telefondan elle de çalıştırılabilir: Actions -> "Haftalik yazi" -> Run workflow.
name: Haftalik yazi

on:
  schedule:
    - cron: "15 18 * * 1,3,5"    # 21:15 TR (GitHub zamanlamayı birkaç saat geciktirebilir)
  workflow_dispatch:

concurrency:
  group: state
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash        # -eo pipefail: a failing command before "| tee" fails the step

jobs:
  yaz:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Europe/Istanbul
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BLOGGER_ID: ${{ secrets.BLOGGER_ID }}
      BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
    steps:
      - uses: actions/checkout@v4

      - name: Durumu çek (state dalı -> data/)
        run: |
          if git ls-remote --exit-code --heads origin state >/dev/null; then
            git clone -q --depth 1 --branch state "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
          else
            mkdir -p data && git -C data init -q -b state
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Blogger girişi
        run: bash blogger_login.sh

      - name: Yaz, kontrol et, taslak gönder
        run: |
          mkdir -p data/logs
          log="data/logs/gunluk-$(date +%F-%H%M).log"
          python write.py --daily 2>&1 | tee "$log"
          python main.py --quota | tee -a "$log"

      - name: Özet
        if: always()
        run: |
          log=$(ls -t data/logs/gunluk-*.log 2>/dev/null | head -1)
          [ -n "$log" ] && { echo '```'; grep -v "httpx\|^INFO" "$log" | tail -60; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Durumu geri yaz
        if: always()
        working-directory: data
        run: |
          rm -f ../token.json
          git config user.name "kronikler-bot"
          git config user.email "kronikler-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "haftalık yazı $(date '+%F %H:%M')"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:state
