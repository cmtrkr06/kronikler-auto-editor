# Kayıtlı bir taslağı Blogger'a TASLAK olarak gönderir. HAZIR değilse önce yazarı çağırmadan yeniden kontrol
# eder (kod + tek fact-check isteği); arşivdeki yeni fotoğraflar hızlı modelle bir kez etiketlenir. Actions -> "Taslak gonder" -> konu anahtarı.
name: Taslak gonder

on:
  workflow_dispatch:
    inputs:
      konu:
        description: "Konu anahtarı başı (örn. ariza-dq200)"
        required: true
      yeniden_yaz:
        description: "Fact-check'te kaldıysa bulgularla bir kez yeniden yazdır (2 Gemini isteği)"
        type: boolean
        default: false

concurrency:
  group: state
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  gonder:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Europe/Istanbul
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BLOGGER_ID: ${{ secrets.BLOGGER_ID }}
      BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
    steps:
      - uses: actions/checkout@v4

      - name: Durumu çek (state dalı -> data/)
        run: git clone -q --depth 1 --branch state "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Blogger girişi
        run: bash blogger_login.sh

      - name: Arşivi yenile ve gönder
        env:
          KONU: ${{ inputs.konu }}
        run: |
          mkdir -p data/logs
          log="data/logs/gonder-$(date +%F-%H%M).log"
          python image_library.py 2>&1 | tee "$log"
          if [ "${{ inputs.yeniden_yaz }}" = "true" ]; then
            python write.py --rewrite "$KONU" 2>&1 | tee -a "$log" || true    # findings fed back, 1 rewrite + 1 check
          else
            python write.py --recheck "$KONU" 2>&1 | tee -a "$log" || true    # not READY -> code check + 1 fact-check
          fi
          python write.py --send "$KONU" 2>&1 | tee -a "$log"
          tail -20 "$log" | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"

      - name: Durumu geri yaz
        if: always()
        working-directory: data
        run: |
          rm -f ../token.json
          git config user.name "kronikler-bot"
          git config user.email "kronikler-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "taslak gönderildi $(date '+%F %H:%M')"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:state
