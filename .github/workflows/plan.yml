# Adım 1 kuru çalıştırma: CarScore'u okur, anlık görüntüyü "state" dalına kaydeder, aday konuları
# yazar. Yapay zeka çağırmaz, Blogger'a dokunmaz. Telefondan: Actions -> "Konu plani (AI yok)" -> Run.
name: Konu plani (AI yok)

on:
  workflow_dispatch:
    inputs:
      goster:
        description: "Veri paketini gösterilecek konu anahtarı başı (örn. ariza-dq200), boş bırakılabilir"
        required: false
        default: ""

concurrency:
  group: state            # state dalına aynı anda iki çalıştırma yazmasın
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Europe/Istanbul
    steps:
      - uses: actions/checkout@v4

      - name: Durumu çek (state dalı -> data/)
        run: |
          if git ls-remote --exit-code --heads origin state >/dev/null; then
            git clone -q --depth 1 --branch state "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
          else
            mkdir -p data && git -C data init -q -b state
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Plan
        run: |
          mkdir -p data/logs
          python main.py --plan ${{ inputs.goster && format('--show {0}', inputs.goster) || '' }} | tee "data/logs/plan-$(date +%F-%H%M).log"

      - name: Özet
        if: always()
        run: |
          log=$(ls -t data/logs/plan-*.log 2>/dev/null | head -1)
          [ -n "$log" ] && { echo '```'; sed -n '1,80p' "$log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Durumu geri yaz
        if: always()
        working-directory: data
        run: |
          git config user.name "kronikler-bot"
          git config user.email "kronikler-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "plan $(date '+%F %H:%M')"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:state
